<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browser window</title>
<style>
  /* A Safari-style window for showing a website screenshot. Window shadow and corner radius
     come from ../examples/mac-ui.css; traffic light colours and sizes are macOS's own. */
  :root {
    color-scheme: light dark;
    --bar: #f6f6f6; --field: rgba(0,0,0,.06); --text: rgba(0,0,0,.85); --muted: rgba(0,0,0,.4); --line: rgba(0,0,0,.1);
    --shadow-window: 0 0 0 .5px rgba(0,0,0,.18), 0 22px 70px rgba(0,0,0,.28), 0 6px 18px rgba(0,0,0,.12);
    --page: #f5f5f7;
  }
  @media (prefers-color-scheme: dark) { :root:not(.light) { --bar: #2b2b2d; --field: rgba(255,255,255,.08); --text: rgba(255,255,255,.88); --muted: rgba(255,255,255,.45); --line: rgba(255,255,255,.08);
    --shadow-window: 0 0 0 .5px rgba(255,255,255,.14), 0 0 0 1px rgba(0,0,0,.7), 0 22px 70px rgba(0,0,0,.55); --page: #000; } }
  :root.dark { --bar: #2b2b2d; --field: rgba(255,255,255,.08); --text: rgba(255,255,255,.88); --muted: rgba(255,255,255,.45); --line: rgba(255,255,255,.08);
    --shadow-window: 0 0 0 .5px rgba(255,255,255,.14), 0 0 0 1px rgba(0,0,0,.7), 0 22px 70px rgba(0,0,0,.55); --page: #000; }

  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--page);
    font: 13px/16px -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
  .browser { width: min(1100px, 92vw); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow-window); background: var(--bar); }
  .browser .bar { height: 52px; display: grid; grid-template-columns: auto auto 1fr auto; align-items: center; gap: 16px; padding: 0 16px; border-bottom: .5px solid var(--line); }
  .browser .traffic { display: flex; gap: 8px; }
  .browser .traffic i { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.18); }
  .browser .traffic i:nth-child(1) { background: #FF5F57; }
  .browser .traffic i:nth-child(2) { background: #FEBC2E; }
  .browser .traffic i:nth-child(3) { background: #28C840; }
  .browser .nav { display: flex; gap: 14px; color: var(--muted); }
  .browser .nav svg { width: 9px; height: 15px; }
  .browser .address { justify-self: center; width: min(460px, 100%); height: 32px; border-radius: 10px; background: var(--field);
    display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--text); }
  .browser .address svg { width: 10px; height: 12px; color: var(--muted); }
  .browser .spacer { width: 52px; }
  .browser .page img { display: block; width: 100%; height: auto; }
</style>

<div class="browser">
  <div class="bar">
    <div class="traffic"><i></i><i></i><i></i></div>
    <div class="nav" aria-hidden="true">
      <svg viewBox="0 0 9 15"><path d="M8 1 1.5 7.5 8 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg viewBox="0 0 9 15"><path d="M1 1l6.5 6.5L1 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="address">
      <svg viewBox="0 0 10 12" aria-hidden="true"><path d="M2.5 5V3.5a2.5 2.5 0 0 1 5 0V5M1.5 5h7v6h-7z" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
      <span>example.com</span>
    </div>
    <div class="spacer"></div>
  </div>
  <!-- A real screenshot of the site at 1440 px wide (2x for sharpness), never a rebuilt copy. -->
  <div class="page"><img src="screenshot-site.png" alt="Describe the page shown"></div>
</div>
</html>
