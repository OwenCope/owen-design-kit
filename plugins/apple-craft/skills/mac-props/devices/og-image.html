<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Link preview</title>
<style>
  /* 1200x630 Open Graph image. make-og.mjs fills the title, line and screenshot and renders it. */
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #f5f5f7; color: #1d1d1f; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    display: grid; grid-template-columns: 470px 1fr; align-items: center; }
  .text { padding: 0 0 0 80px; }
  h1 { margin: 0; font-size: 64px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em; }
  p { margin: 18px 0 0; font-size: 28px; line-height: 1.25; color: #6e6e73; }
  .shot { position: relative; height: 630px; }
  /* The screenshot bleeds off the right and bottom edges so it reads big at small sizes. */
  .shot img { position: absolute; left: 30px; top: 80px; width: 820px; border-radius: 18px;
    box-shadow: 0 0 0 .5px rgba(0,0,0,.18), 0 22px 70px rgba(0,0,0,.28); }
</style>
<div class="text"><h1 id="title">Product</h1><p id="line">One short line about what it does.</p></div>
<div class="shot"><img id="image" src="screenshot-site.png" alt=""></div>
</html>
