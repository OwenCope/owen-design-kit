<!doctype html>
<!-- A complete Mac scene. Run scripts/make-assets.swift into ./mac-assets, copy assets/macbook-air-shell.webp
     next to this file, and put your window screenshots in as window-light.png and window-dark.png. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mac scene</title>
<style>
  body { margin: 0; padding: 6vw; background: #f5f5f7; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  @media (prefers-color-scheme: dark) { body { background: #000; } }

  /* Percentages are measured for macbook-air-shell.webp (1920×1280). */
  .mac { position: relative; aspect-ratio: 1920 / 1280; max-width: 1200px; margin: 0 auto; }
  .mac .plate  { position: absolute; left: 19.1%; top: 18.7%; width: 61.8%; height: 59.6%; background: #000; }
  .mac .screen { position: absolute; left: 19.444%; top: 19.067%; width: 61.111%; height: 58.933%; overflow: hidden;
                 container-type: size; background: url(mac-assets/wallpaper.jpg) center / cover;
                 display: flex; justify-content: center; align-items: flex-start; padding: 4% 4% 7.5%; box-sizing: border-box; }
  .mac .shell  { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  /* Menu bar: SF Symbol masks take the text colour, dark on light wallpapers and white on dark ones. */
  .mbar { position: absolute; inset: 0 0 auto; height: 2.5cqw; padding: 0 1.6cqw; display: flex; align-items: center; gap: 1.6cqw;
          font: 500 1.2cqw/1 -apple-system, BlinkMacSystemFont, sans-serif; color: #fff; }   /* white: the default wallpaper is the dark Pro Black */
  .mbar b { font-weight: 700; }
  .mbar i { display: block; width: 1.9cqw; height: 1.9cqw; background: currentColor;
            -webkit-mask: var(--m) center / contain no-repeat; mask: var(--m) center / contain no-repeat; }
  .mbar .gap { width: 22cqw; flex: none; }   /* the notch */
  .mbar .right { margin-left: auto; display: flex; align-items: center; gap: 1.4cqw; }
  @media (prefers-color-scheme: dark) { .mbar { color: #fff; } }

  /* The window: a real screenshot, light and dark. Sits just above the Dock. */
  .window { width: 100%; height: auto; border-radius: 1.6cqh; box-shadow: 0 1cqh 4cqh rgb(0 0 0 / 0.3); }
  .window.dark { display: none; }
  @media (prefers-color-scheme: dark) { .window.light { display: none; } .window.dark { display: block; } }

  /* Dock: real icons at real proportions, glass shelf, a running dot under the app in use. */
  .dock { position: absolute; left: 50%; bottom: 0.8cqw; transform: translateX(-50%); display: flex; align-items: center; gap: 0.15cqw;
          padding: 0.35cqw 0.45cqw; border-radius: 1.5cqw; background: rgb(255 255 255 / 0.28);
          backdrop-filter: blur(16px) saturate(170%); -webkit-backdrop-filter: blur(16px) saturate(170%);
          box-shadow: inset 0 0 0 0.5px rgb(255 255 255 / 0.55), inset 0 1px 0 rgb(255 255 255 / 0.6), 0 1cqh 3cqh rgb(0 0 0 / 0.18); }
  .dock img { width: 3.6cqw; height: 3.6cqw; display: block; }
  .dock .sep { width: 1px; height: 3cqw; margin: 0 0.3cqw; background: rgb(0 0 0 / 0.15); }
  .dock .run { position: relative; }
  .dock .run::after { content: ""; position: absolute; left: 50%; bottom: -0.25cqw; width: 0.3cqw; height: 0.3cqw;
                      margin-left: -0.15cqw; border-radius: 50%; background: rgb(0 0 0 / 0.55); }
  @media (prefers-color-scheme: dark) {
    .dock { background: rgb(40 40 44 / 0.35); box-shadow: inset 0 0 0 0.5px rgb(255 255 255 / 0.2), 0 1cqh 3cqh rgb(0 0 0 / 0.4); }
    .dock .sep { background: rgb(255 255 255 / 0.2); }
    .dock .run::after { background: rgb(255 255 255 / 0.7); }
  }
</style>
</head>
<body>
  <div class="mac">
    <div class="plate" aria-hidden="true"></div>
    <div class="screen">
      <div class="mbar" aria-hidden="true">
        <i style="--m:url(mac-assets/menubar/apple.png)"></i><b>App</b><span>File</span><span>Edit</span><span>View</span>
        <span class="gap"></span>
        <span class="right">
          <i style="--m:url(mac-assets/menubar/battery.png)"></i>
          <i style="--m:url(mac-assets/menubar/wifi.png)"></i>
          <i style="--m:url(mac-assets/menubar/search.png)"></i>
          <i style="--m:url(mac-assets/menubar/control.png)"></i>
          <span>Thu Oct 9&nbsp; 9:41 AM</span>
        </span>
      </div>
      <img class="window light" src="window-light.png" alt="Describe what the window shows">
      <img class="window dark" src="window-dark.png" alt="" aria-hidden="true">
      <div class="dock" aria-hidden="true">
        <img src="mac-assets/dock/finder.png" alt=""><img src="mac-assets/dock/safari.png" alt=""><img src="mac-assets/dock/messages.png" alt="">
        <img src="mac-assets/dock/mail.png" alt=""><img src="mac-assets/dock/photos.png" alt=""><img src="mac-assets/dock/music.png" alt="">
        <img src="mac-assets/dock/calendar.png" alt=""><img src="mac-assets/dock/notes.png" alt="">
        <span class="run"><img src="mac-assets/dock/app.png" alt=""></span>
        <img src="mac-assets/dock/appstore.png" alt=""><img src="mac-assets/dock/settings.png" alt="">
        <span class="sep"></span><img src="mac-assets/dock/trash.png" alt="">
      </div>
    </div>
    <img class="shell" src="macbook-air-shell.webp" alt="" aria-hidden="true">
  </div>
</body>
</html>
