<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>motion-kit: notch shelf</title>
<!-- Reference build of a notch interaction with motion-kit. Needs ./mac-assets (run mac-props/scripts/make-assets.swift ./mac-assets).
     Copy the patterns, not the page:
     - one shape that grows out of the notch, with the notch's own shoulders, never a box underneath
     - a notch that answers when something comes near (grows, glows) and pulls it in (magnet)
     - files that fly in on an arc, tilt into the turn and land with a squash
     - parked files peeking inside the closed notch as tiny icons
     - a shelf whose items stagger in, lift on hover, and come out by pulling down or clicking
     - every move reversed on the way out, and Clear sending each file home on its own arc -->
<style>
  :root { --bg: #f2f2f5; --ink: #1d1d1f; --muted: rgba(0,0,0,.5); color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b0b0d; --ink: #f5f5f7; --muted: rgba(255,255,255,.55); } }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); overflow: hidden;
         font: 17px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; -webkit-font-smoothing: antialiased; }

  /* The notch: one black shape. Its shoulders are concave curves where it meets the top edge, like the real one. */
  .notch { position: fixed; top: 0; left: 50%; translate: -50% 0; width: 200px; height: 32px; background: transparent;
           border-radius: 0 0 12px 12px; z-index: 10; color: #fff; outline: none;
           box-shadow: 0 0 0 0 rgba(255,255,255,0); transition: box-shadow .25s ease; }
  .notch::before, .notch::after { content: ""; position: absolute; top: 0; width: 10px; height: 10px; pointer-events: none;
           background: radial-gradient(circle at 0 100%, transparent 9.5px, #000 10px); }
  .notch::before { left: -10px; } .notch::after { right: -10px; transform: scaleX(-1); }
  .notch.near { box-shadow: inset 0 -1px 0 rgba(255,255,255,.18), 0 6px 24px rgba(0,0,0,.25); }
  .notch:focus-visible { box-shadow: 0 0 0 3px #0071e3; }
  .clip { position: absolute; inset: 0; overflow: hidden; border-radius: inherit;
          /* Black where it meets the notch, fading into frosted glass below, like the real panel. */
          background: linear-gradient(#000 0, #000 34px, rgba(22,22,24,.78) 96px, rgba(48,48,52,.62) 100%);
          -webkit-backdrop-filter: blur(26px) saturate(1.7); backdrop-filter: blur(26px) saturate(1.7); }
  /* While a file is being dragged: the drop panel with its target tile. */
  .drops { position: absolute; left: 14px; right: 14px; top: 40px; bottom: 14px; display: flex; gap: 10px; opacity: 0; pointer-events: none; }
  .tile { flex: 1; border-radius: 18px; background: rgba(255,255,255,.08); display: grid; place-content: center; justify-items: center; gap: 6px;
          color: rgba(255,255,255,.8); font: 600 12px/1 -apple-system, sans-serif; transition: background .2s, color .2s; }
  .tile img { width: 22px; height: 22px; filter: invert(1); opacity: .8; }
  .tile.hot { background: rgba(255,255,255,.22); color: #fff; }
  .notch.dragging .peek, .notch.dragging .head, .notch.dragging .shelf { opacity: 0 !important; }

  /* Closed: up to three parked files peek inside the notch, beside the camera area. */
  .peek { position: absolute; top: 7px; right: 12px; height: 18px; display: flex; flex-direction: row-reverse; }
  .notch[aria-expanded="true"] .peek { opacity: 0; }
  .peek { transition: opacity .15s; }
  .peek { gap: 5px; top: 8px; right: 14px; height: 16px; align-items: center; }
  .peek img { width: 16px; height: 16px; opacity: .9; }
  .notch.morphing .clip { -webkit-backdrop-filter: none; backdrop-filter: none; }
  .peek b { font: 600 11px/18px -apple-system, sans-serif; color: rgba(255,255,255,.6); margin-left: 4px; order: -1; }

  /* Open: the shelf. */
  .head { position: absolute; top: 40px; left: 22px; right: 16px; display: flex; align-items: center; justify-content: space-between;
          opacity: 0; font: 600 12px/16px -apple-system, sans-serif; color: rgba(255,255,255,.55); }
  .clear, .done { width: 34px; height: 34px; border-radius: 17px; border: 0; background: rgba(255,255,255,.14); cursor: pointer;
           display: grid; place-items: center; }
  .clear:hover, .done:hover { background: rgba(255,255,255,.24); }
  .clear img, .done img { width: 14px; height: 14px; filter: invert(1); }
  .actions { display: flex; gap: 8px; }
  .shelf { position: absolute; left: 0; right: 0; top: 74px; padding: 0 22px; display: flex; justify-content: center; gap: 14px; }
  .item { width: 78px; text-align: center; opacity: 0; cursor: grab; touch-action: none; border-radius: 12px; padding: 6px 0 4px;
          user-select: none; -webkit-user-select: none; background: none; border: 0; color: inherit; font: inherit; }
  .item:focus-visible { box-shadow: 0 0 0 3px #0071e3; }
  .item img, .file img { -webkit-user-drag: none; user-select: none; }
  .notch, .stage { user-select: none; -webkit-user-select: none; }
  .item:hover { background: rgba(255,255,255,.08); }
  .item img { width: 52px; height: 52px; display: block; margin: 0 auto 6px; pointer-events: none; }
  .item span { display: block; padding: 0 4px; font-size: 11px; line-height: 14px; color: rgba(255,255,255,.88);
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* The desk. */
  .stage { height: 100%; display: grid; place-content: center; justify-items: center; gap: 64px; padding-top: 40px; }
  h1 { margin: 0; font-size: clamp(40px, 6vw, 72px); line-height: 1.04; letter-spacing: -.035em; text-align: center; font-weight: 700; }
  .desk { display: flex; gap: 40px; flex-wrap: wrap; justify-content: center; }
  .file { width: 104px; padding: 8px 0; border-radius: 14px; text-align: center; user-select: none; outline: none; }
  .file:focus-visible { box-shadow: 0 0 0 3px #0071e3; }
  .file img { width: 84px; height: 84px; display: block; margin: 0 auto 8px; pointer-events: none; }
  .file span { font-size: 13px; }
  .hint { color: var(--muted); font-size: 15px; margin: 0; transition: opacity .3s; }
  @media (max-width: 600px) { .desk { display: grid; grid-template-columns: repeat(2, 120px); gap: 28px 36px; } .file { width: 120px; } .file img { width: 72px; height: 72px; } }
</style>
</head>
<body>
  <div class="notch" id="notch" tabindex="0" role="button" aria-label="Shelf, empty" aria-expanded="false">
    <div class="clip">
      <div class="peek" id="peek"></div>
      <div class="head" id="head"><span id="title"></span>
        <span class="actions"><button class="done" id="done" aria-label="Close the shelf"><img src="mac-assets/menubar/checkmark.png" alt=""></button><button class="clear" id="clear" aria-label="Clear the shelf"><img src="mac-assets/menubar/trash.png" alt=""></button></span></div>
      <div class="shelf" id="shelf"></div>
      <div class="drops" id="drops"><div class="tile" id="keep"><img src="mac-assets/menubar/tray.png" alt=""><span>Keep</span></div></div>
    </div>
  </div>

  <main class="stage">
    <h1>Put it in the notch.</h1>
    <div class="desk" id="desk">
      <div class="file" tabindex="0" data-name="Proposal.pdf" data-icon="pdf"><img src="mac-assets/files/pdf.png" alt=""><span>Proposal.pdf</span></div>
      <div class="file" tabindex="0" data-name="Launch.key" data-icon="keynote"><img src="mac-assets/files/keynote.png" alt=""><span>Launch.key</span></div>
      <div class="file" tabindex="0" data-name="Moodboard.png" data-icon="png"><img src="mac-assets/files/png.png" alt=""><span>Moodboard.png</span></div>
      <div class="file" tabindex="0" data-name="Clip.mov" data-icon="movie"><img src="mac-assets/files/movie.png" alt=""><span>Clip.mov</span></div>
    </div>
    <p class="hint" id="hint">Drag a file to the notch, or flick it up.</p>
  </main>

<script src="motion.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const notch = $('notch'), shelf = $('shelf'), peek = $('peek'), head = $('head'), title = $('title'), hint = $('hint');
  const parked = [];
  let open = false, closeTimer = 0, busy = Promise.resolve(), landing = Promise.resolve();
  const queue = (fn) => (busy = busy.then(fn, fn));   // one notch animation at a time, in order

  const CLOSED = { width: 200, height: 32, radius: 12 };
  const peekWidth = () => (parked.length ? 224 + Math.min(parked.length, 3) * 21 + (parked.length > 3 ? 22 : 0) : 200);
  const closedSize = () => ({ ...CLOSED, width: peekWidth() });
  const NEAR = () => ({ width: peekWidth() + 40, height: 42, radius: 16 });
  const openSize = () => ({ width: Math.max(340, 44 + parked.length * 92), height: 196, radius: 30 });
  const DROP = () => ({ width: Math.max(340, open ? openSize().width : 0), height: open ? 196 : 132, radius: 30 });

  function renderPeek() {
    peek.innerHTML = parked.slice(-3).map((f) => `<img src="mac-assets/files/${f.dataset.icon}.png" alt="">`).join('')
      + (parked.length > 3 ? `<b>+${parked.length - 3}</b>` : '');
    title.textContent = parked.length === 1 ? '1 waiting' : `${parked.length} waiting`;
    notch.setAttribute('aria-label', parked.length ? `Shelf, ${parked.length} waiting` : 'Shelf, empty');
    hint.textContent = parked.length === 4 ? 'Hover the notch to see what’s waiting.' : 'Drag a file to the notch, or flick it up.';
  }
  function makeItem(f) {
    const item = document.createElement('button');
    item.className = 'item'; item.type = 'button'; item.file = f;
    item.setAttribute('aria-label', `Take ${f.dataset.name} back out`);
    item.innerHTML = `<img src="mac-assets/files/${f.dataset.icon}.png" alt=""><span>${f.dataset.name}</span>`;
    // Take it out: click (pointer tap or keyboard Enter/Space), or pull it down out of the shelf.
    let y0 = null;
    item.addEventListener('pointerdown', (e) => { e.preventDefault(); y0 = e.clientY; item.setPointerCapture(e.pointerId); });
    item.addEventListener('pointermove', (e) => {
      if (y0 === null) return;
      const dy = Math.max(0, e.clientY - y0);
      item.style.transform = `translateY(${Math.min(dy * 0.35, 14)}px)`;
      if (dy > 46) { y0 = null; unpark(item); }
    });
    item.addEventListener('pointerup', () => { if (y0 !== null) { y0 = null; unpark(item); } });
    // Keyboard clicks have detail 0; pointer taps already unparked on pointerup, and the notch
    // click handler ignores .item targets, so this never double-fires.
    item.addEventListener('click', (e) => { if (e.detail === 0) unpark(item); });
    item.addEventListener('pointerenter', () => Motion.spring({ s: 1 }, { s: 1.07 }, ({ s }) => { item.style.scale = s; }, 'snappy'));
    item.addEventListener('pointerleave', () => Motion.spring({ s: parseFloat(item.style.scale) || 1 }, { s: 1 }, ({ s }) => { item.style.scale = s; }, 'snappy'));
    return item;
  }

  const openShelf = () => queue(async () => {
    await landing;                                // a file still in flight counts: open once it lands
    if (open || !parked.length) return; open = true;
    notch.setAttribute('aria-expanded', 'true');
    Motion.stagger(peek.children, { show: false, gap: 0 });
    // Don't wait for the spring to fully settle: content starts once the shape is mostly open.
    Motion.morph(notch, openSize(), 'island');
    await new Promise((r) => setTimeout(r, Motion.reduced() ? 0 : 90));
    Motion.stagger([head], { show: true });
    await Motion.stagger(shelf.children, { show: true, gap: 22 });
  });
  const closeShelf = (fast = false) => queue(async () => {
    if (!open) return; open = false;
    peek.innerHTML = '';
    notch.setAttribute('aria-expanded', 'false');
    // Content and shape leave together: no empty box left hanging while items fade one by one.
    Motion.stagger([head, ...shelf.children], { show: false, gap: 0, distance: 4 });
    await new Promise((r) => setTimeout(r, fast || Motion.reduced() ? 0 : 70));
    await Motion.morph(notch, closedSize(), 'snappy');
    renderPeek(); Motion.stagger(peek.children, { show: true, gap: 25, distance: 3 });
  });

  async function park(file, from) {
    if (file.dataset.parked) return;
    file.dataset.parked = '1';
    file.style.visibility = 'hidden';            // it leaves the desk the moment it is let go
    hint.style.opacity = 0;
    const flight = Motion.flyTo(file.querySelector('img'), notch.classList.contains('dragging') ? keep : notch, { scale: 0.22, lift: 110,
      from: from && from.width ? { left: from.left + (from.width - 84) / 2, top: from.top + 8, width: 84, height: 84 } : undefined });
    landing = Promise.all([landing, flight]);
    await flight;
    parked.push(file);
    const item = makeItem(file); shelf.appendChild(item);
    renderPeek(); hint.style.opacity = '';
    if (open) { await Motion.morph(notch, openSize(), 'island'); Motion.stagger([item], { show: true }); }
    else { await Motion.morph(notch, closedSize(), 'snappy'); Motion.stagger([peek.lastElementChild || peek.firstElementChild], { show: true, distance: 4 }); }
  }

  async function unpark(item, { quiet = false } = {}) {
    const file = item.file; if (!file.dataset.parked) return;
    delete file.dataset.parked;
    parked.splice(parked.indexOf(file), 1);
    const from = item.querySelector('img').getBoundingClientRect();
    item.style.visibility = 'hidden';
    const fly = Motion.flyTo(item.querySelector('img'), file.querySelector('img'), { from, scale: 84 / 52, lift: -30, bump: false });
    if (!quiet) {
      await Motion.stagger([item], { show: false, gap: 0 });
      item.remove(); renderPeek();
      if (!parked.length) closeShelf(); else Motion.morph(notch, openSize(), 'island');
    }
    await fly;
    file.style.visibility = ''; Motion.catchBump(file, 0.08);
    if (quiet) item.remove();
  }

  // Desk files: drag (with magnet and flick), keyboard Enter or Space to send.
  // Desk files. As soon as a drag starts, the notch opens into a drop panel; the Keep tile lights up
  // when the file is over it. Keyboard: Enter or Space sends the focused file.
  const keep = $('keep'), drops = $('drops');
  const showDrops = async () => {
    clearTimeout(closeTimer); notch.classList.add('dragging');
    Motion.morph(notch, DROP(), 'island'); setTimeout(() => Motion.stagger([drops], { show: true, distance: 6 }), Motion.reduced() ? 0 : 120);
  };
  const hideDrops = async (dropped) => {
    notch.classList.remove('dragging'); keep.classList.remove('hot');
    await Motion.stagger([drops], { show: false, distance: 6 });
    // Shrink straight away, also on a drop: the file is already flying, an empty panel must not wait for it.
    Motion.morph(notch, open ? openSize() : closedSize(), 'snappy');
  };
  document.querySelectorAll('.file').forEach((file) => {
    Motion.draggable(file, {
      onStart: showDrops,
      onEnd: (dropped) => hideDrops(dropped),
      targets: [{ el: keep, radius: 150, magnet: 0.3,
        onEnter: () => keep.classList.add('hot'),
        onLeave: () => keep.classList.remove('hot'),
        onDrop: (el, from) => park(el, from) }],
    });
    file.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); park(file); } });
  });

  // Mouse clicks don't take focus, so the keyboard focus ring only shows for keyboard users.
  notch.addEventListener('mousedown', (e) => e.preventDefault());
  // The notch: hover to peek, click or keyboard to toggle.
  notch.addEventListener('pointerenter', () => { clearTimeout(closeTimer); openShelf(); });
  notch.addEventListener('pointerleave', () => { closeTimer = setTimeout(closeShelf, 320); });
  notch.addEventListener('click', (e) => { if (e.target.closest('.item, .clear, .done')) return; open ? closeShelf() : openShelf(); });
  notch.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open ? closeShelf() : openShelf(); } if (e.key === 'Escape') closeShelf(); });

  // Clear: every file goes home on its own arc, a beat apart, then the notch closes.
  // No stopPropagation: the notch click handler above already ignores .item/.clear/.done targets.
  $('done').addEventListener('click', () => closeShelf());
  $('clear').addEventListener('click', async () => {
    const items = [...shelf.children];
    head.style.opacity = 0;
    // Launch every file home a beat apart, and shrink the notch back while they are still in the air.
    const flights = items.map((item, i) => new Promise((r) => setTimeout(() => unpark(item, { quiet: true }).then(r), i * 90)));
    closeShelf(true);
    await Promise.all(flights);
    renderPeek(); Motion.morph(notch, closedSize(), 'snappy');
  });

  renderPeek();
</script>
</body>
</html>
