<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidepool: two-equal-ctas pair</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif; color: #1d1d1f; background: #fbfbfd; }
  .state { max-width: 900px; margin: 0 auto; padding: 120px 48px; text-align: center; }
  h1 { font-size: 44px; letter-spacing: -0.02em; }
  .sub { font-size: 17px; color: #6e6e73; margin: 12px 0 30px; }
  .ctas { display: flex; gap: 14px; justify-content: center; }
  .pill { font-size: 16px; font-weight: 600; padding: 13px 30px; border-radius: 999px; border: 0; cursor: pointer; }
  #bad .pill { background: #0071e3; color: #fff; }
  #good .primary { background: #0071e3; color: #fff; }
  #good .secondary { background: transparent; color: #0071e3; padding: 13px 10px; font-weight: 500; }
</style>
</head>
<body>
<section class="state" id="bad">
  <h1>A calm home for every task</h1>
  <p class="sub">Tidepool for Mac. Free to try.</p>
  <div class="ctas"><button class="pill">Download</button><button class="pill">Buy Tidepool</button></div>
</section>
<section class="state" id="good">
  <h1>A calm home for every task</h1>
  <p class="sub">Tidepool for Mac. Free to try.</p>
  <div class="ctas"><button class="pill primary">Download</button><button class="pill secondary">Buy Tidepool</button></div>
</section>
<script>
  function s(){var h=(location.hash||"#bad");document.querySelectorAll(".state").forEach(function(e){e.style.display=("#"+e.id===h)?"block":"none";});}
  addEventListener("hashchange",s);s();
</script>
</body>
</html>
