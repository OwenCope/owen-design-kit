<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidepool: download-label pair</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif; color: #1d1d1f; background: #fbfbfd; }
  .state { max-width: 900px; margin: 0 auto; padding: 130px 48px; text-align: center; }
  h1 { font-size: 40px; letter-spacing: -0.02em; }
  .sub { font-size: 17px; color: #6e6e73; margin: 12px 0 28px; }
  .btn { font-size: 16px; font-weight: 600; padding: 13px 30px; border-radius: 999px; border: 0; background: #0071e3; color: #fff; cursor: pointer; }
  .meta { margin-top: 10px; font-size: 13px; color: #6e6e73; }
</style>
</head>
<body>
<section class="state" id="bad">
  <h1>A calm home for every task</h1>
  <p class="sub">Tidepool for Mac. Free to try.</p>
  <button class="btn">Download</button>
</section>
<section class="state" id="good">
  <h1>A calm home for every task</h1>
  <p class="sub">Tidepool for Mac. Free to try.</p>
  <button class="btn">Download for Mac</button>
  <p class="meta">Version 4.2 stable &middot; 28 MB disk image</p>
</section>
<script>
  function s(){var h=(location.hash||"#bad");document.querySelectorAll(".state").forEach(function(e){e.style.display=("#"+e.id===h)?"block":"none";});}
  addEventListener("hashchange",s);s();
</script>
</body>
</html>
